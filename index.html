<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- اسم الموقع الذي يظهر في أعلى المتصفح وفي محركات البحث -->
    <title>موقع حسين طيفور العوض الرسمي</title> 
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 0; text-align: center; }
        header { background-color: #2c3e50; color: white; padding: 40px 20px; }
        h1 { margin: 0; font-size: 2.5em; }
        .container { max-width: 800px; margin: 30px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .site-img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; border: 3px solid #2c3e50; }
        p { font-size: 1.2em; line-height: 1.6; color: #555; }
        .btn { display: inline-block; padding: 12px 30px; background-color: #e74c3c; color: white; text-decoration: none; border-radius: 25px; font-weight: bold; margin-top: 20px; transition: 0.3s; }
        .btn:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <header>
        <!-- اسم موقعك الرئيسي الداخلي -->
        <h1>موقع فريد</h1>
        <p>مرحباً بكم في منصتي الشخصية على الإنترنت</p>
    </header>

    <div class="container">
        <!-- لإضافة صورة: ضع اسم ملف الصورة بدلاً من image.jpg (سنشرحها في الخطوة القادمة) -->
        <img src="image.jpg" alt="صورة الموقع" class="site-img">
        
        <h2>حول الموقع للنشر</h2>
        <p>هذا الموقع تم بناؤه وتطويره بالكامل من خلال الهاتف الذكي عبر بيئة الأوامر Termux. نهدف من خلال هذا الموقع إلى تقديم محتوى فريد ومشاركة الأفكار والمشاريع مع العالم.</p>
        
        <a href="#" class="btn">تواصل معي</a>
    </div>

</body>
</html>
